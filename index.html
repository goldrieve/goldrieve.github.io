<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goldrieve</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header / Navigation -->
        <header class="header">
            <div class="logo">goldrieve</div>
            <nav class="social-links">
                <a href="https://github.com/goldrieve" target="_blank">github</a>
                <a href="/rss.xml">rss</a>
            </nav>
        </header>

        <!-- Introduction Section -->
        <section class="intro">
            <p>Hi, I'm Guy. I build things.</p>
        </section>

        <!-- Filter Controls -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">all</button>
            <span class="filter-count">0</span>
            <button class="filter-btn" data-filter="essays">#essays</button>
            <span class="filter-count">0</span>
            <button class="filter-btn" data-filter="projects">#projects</button>
            <span class="filter-count">0</span>
            <button class="filter-btn" data-filter="tags">all tags</button>
            <span class="filter-count">+</span>
        </div>

        <!-- Content Gallery -->
        <div class="content-list">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
